<svg
    xmlns="http://www.w3.org/2000/svg"
    width="460"
    height="180"
    viewBox="0 0 460 180"
    role="img"
>
<style>
    .card {
        fill: #ffffff;
        stroke: #d0d7de;
        stroke-width: 1;
    }

    .title {
        fill: #1f2328;
        font: 600 18px -apple-system, BlinkMacSystemFont,
              "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .label {
        fill: #656d76;
        font: 400 12px -apple-system, BlinkMacSystemFont,
              "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .value {
        fill: #1f2328;
        font: 600 22px -apple-system, BlinkMacSystemFont,
              "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .language {
        fill: #1f2328;
        font: 400 13px -apple-system, BlinkMacSystemFont,
              "Segoe UI", Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
        .card {
            fill: #0d1117;
            stroke: #30363d;
        }

        .title,
        .value,
        .language {
            fill: #e6edf3;
        }

        .label {
            fill: #8d96a0;
        }
    }
</style>

<rect class="card"
      x="0.5"
      y="0.5"
      width="459"
      height="179"
      rx="8"/>

<text class="title" x="20" y="31">
    Most Used Languages
</text>

<rect
    x="20.00"
    y="50"
    width="184.71"
    height="10"
    fill="#3178c6"
    rx="2"
/>

<rect
    x="204.71"
    y="50"
    width="127.86"
    height="10"
    fill="#f34b7d"
    rx="2"
/>

<rect
